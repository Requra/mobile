<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Meeting - Requra.ai</title>
    <style>
        :root {
            --primary-color: #6366F1;
            --primary-hover: #4F46E5;
            --bg-color: #F9FAFB;
            --text-main: #111827;
            --text-secondary: #4B5563;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .logo {
            width: 80px;
            height: 80px;
            background-color: var(--primary-color);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }

        .logo svg {
            width: 40px;
            height: 40px;
            fill: white;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            margin-top: 0;
        }

        p {
            font-size: 15px;
            line-height: 1.5;
            color: var(--text-secondary);
            margin-bottom: 32px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px 0;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            box-sizing: border-box;
            margin-bottom: 12px;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
        }

        .btn-secondary:hover {
            background-color: rgba(99, 102, 241, 0.05);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Placeholder Logo (replace with actual SVG) -->
        <div class="logo">
            <svg viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/>
            </svg>
        </div>

        <h1>Join Meeting</h1>
        <p>You need the Requra.ai app to join this meeting from your mobile device.</p>

        <a id="openAppBtn" href="#" class="btn btn-primary">Open in App</a>
        
        <a href="https://requra-ai.runasp.net" class="btn btn-secondary">Open in Website</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Extract meetingId from URL path (assuming /meetings/{id}/join)
            const pathSegments = window.location.pathname.split('/').filter(p => p);
            let meetingId = '';
            
            if (pathSegments.length >= 3 && pathSegments[0] === 'meetings' && pathSegments[2] === 'join') {
                meetingId = pathSegments[1];
            }

            const openAppBtn = document.getElementById('openAppBtn');
            
            openAppBtn.addEventListener('click', function(e) {
                e.preventDefault();
                
                // Construct the custom iOS URL scheme
                const customSchemeUrl = meetingId ? `requra://meetings/${meetingId}/join` : 'requra://';
                
                // Try to open the app via custom scheme
                window.location.href = customSchemeUrl;
            });
            
            // Auto-attempt to open the app (commented out by default to avoid jarring experience, 
            // but can be enabled if desired)
            // if (meetingId) {
            //     setTimeout(() => {
            //         window.location.href = `requra://meetings/${meetingId}/join`;
            //     }, 500);
            // }
        });
    </script>
</body>
</html>
